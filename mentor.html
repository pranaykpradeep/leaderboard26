<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor Portal</title>
    <!-- PapaParse for reading the CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #f4f7f6;
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #1a2a6c;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        select, button {
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        button {
            background: #1a2a6c;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background: #b21f1f;
        }
        .task-list {
            margin-top: 20px;
        }
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #eee;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        .task-item.completed {
            background: #d4edda;
            color: #155724;
        }
        .task-item.locked {
            opacity: 0.65;
            background: #e9ecef;
            border-left: 4px solid #ced4da;
        }
        .locked-badge {
            color: #6c757d;
            font-size: 13px;
            font-weight: 500;
        }
        .task-item button {
            width: auto;
            margin: 0;
            padding: 8px 15px;
            font-size: 14px;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header-row h1 {
            margin-bottom: 0;
            text-align: left;
            color: #1a2a6c;
        }
        .refresh-btn {
            width: auto;
            margin: 0;
            background: #f8f9fa;
            color: #1a2a6c;
            border: 1px solid #ced4da;
            padding: 7px 14px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .refresh-btn:hover {
            background: #e2e6ea;
            border-color: #adb5bd;
        }
        .refresh-btn.spinning .refresh-icon {
            display: inline-block;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        #status-msg {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            color: green;
        }
        .error {
            color: red !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <h1>Mentor Portal</h1>
        <button id="refresh-btn" class="refresh-btn" onclick="triggerMentorRefresh()" title="Sync data">
            <span class="refresh-icon">🔄</span> Refresh
        </button>
    </div>
    
    <div class="form-group">
        <label for="team-select">Select Your Team</label>
        <select id="team-select" onchange="loadTeamData()">
            <option value="">-- Choose Team --</option>
            <option value="Team 1">Team 1</option>
            <option value="Team 2">Team 2</option>
            <option value="Team 3">Team 3</option>
            <option value="Team 4">Team 4</option>
            <option value="Team 5">Team 5</option>
            <option value="Team 6">Team 6</option>
            <option value="Team 7">Team 7</option>
            <option value="Team 8">Team 8</option>
            <option value="Team 9">Team 9</option>
            <option value="Team 10">Team 10</option>
            <option value="Team 11">Team 11</option>
            <option value="Team 12">Team 12</option>
            <option value="Team 13">Team 13</option>
            <option value="Team 14">Team 14</option>
            <option value="Team 15">Team 15</option>
            <option value="Team 16">Team 16</option>
            <option value="Team 17">Team 17</option>
        </select>
    </div>

    <div id="status-msg"></div>

    <div id="tasks-container" class="task-list" style="display: none;">
        <h3>Tasks</h3>
        <p style="margin-bottom: 15px; font-size: 14px; color: #666;">Click "Complete" when your team finishes a task. The system will record the exact time securely to the master sheet.</p>
        <div id="task-list"></div>
    </div>
</div>

<script>
    // ==========================================
    // CONFIGURATION
    // ==========================================
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxOiUteM5VmZCXIQVsvsgRvTXIiTf82WAuA3LDyPuRgK-_w5qLCLmVxT4FPUbUyF9gScA/exec';
    const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8S9cCzPnrWOIEFwbs97BG_k602zTW8b572790RXSMtd7PZEtuvLSPmBENQIWPn28McGpDEnkin4Zc/pub?output=csv';
    const GOOGLE_FORM_ACTION_URL = 'https://docs.google.com/forms/d/e/1FAIpQLScZQf4uIOh_uJJeH9T7e-i5-rEdlynEJ4DlkxrWrg4iSCXAsQ/formResponse';
    
    // Entry IDs from the Google Form
    const TEAM_ENTRY_ID = 'entry.2016818712';
    const TASK_ENTRY_ID = 'entry.320462121';

    let completedTasksPerTeam = {}; // { "NOVA": ["Task 1", "Task 2"] }

    // Fetch real-time data from Google Apps Script (with CSV fallback)
    function fetchState() {
        return fetch(APPS_SCRIPT_URL)
            .then(res => {
                if (!res.ok) throw new Error("Apps Script status: " + res.status);
                return res.json();
            })
            .then(rows => {
                if (Array.isArray(rows)) {
                    processData(rows);
                } else {
                    throw new Error("Invalid format from Apps Script");
                }
            })
            .catch(err => {
                // Fallback to published CSV
                return new Promise((resolve) => {
                    Papa.parse(`${GOOGLE_SHEET_CSV_URL}&_=${Date.now()}`, {
                        download: true,
                        header: true,
                        skipEmptyLines: true,
                        complete: function(results) {
                            processData(results.data);
                            resolve();
                        },
                        error: function() {
                            showMessage("Error connecting to data. Please refresh.", true);
                            resolve();
                        }
                    });
                });
            });
    }

    function triggerMentorRefresh() {
        const btn = document.getElementById('refresh-btn');
        if (btn) {
            btn.classList.add('spinning');
            btn.disabled = true;
        }
        fetchState().finally(() => {
            if (btn) {
                setTimeout(() => {
                    btn.classList.remove('spinning');
                    btn.disabled = false;
                }, 500);
            }
        });
    }

    function processData(rows) {
        if (!rows || rows.length === 0) {
            completedTasksPerTeam = {};
            loadTeamData();
            return;
        }

        const headers = Object.keys(rows[0]);
        const teamCol = headers.find(h => h.toLowerCase().includes('team')) || headers[1];
        const taskCol = headers.find(h => h.toLowerCase().includes('task')) || headers[2];

        completedTasksPerTeam = {};
        rows.forEach(row => {
            let team = row[teamCol]?.toString().trim();
            let task = row[taskCol]?.toString().trim();
            if (!team || !task) return;

            if (!completedTasksPerTeam[team]) {
                completedTasksPerTeam[team] = [];
            }
            if (!completedTasksPerTeam[team].includes(task)) {
                completedTasksPerTeam[team].push(task);
            }
        });

        // Refresh UI if a team is already selected
        loadTeamData();
    }

    function loadTeamData() {
        const teamName = document.getElementById('team-select').value;
        const container = document.getElementById('tasks-container');
        const taskList = document.getElementById('task-list');
        
        if (!teamName) {
            container.style.display = 'none';
            return;
        }

        const teamCompleted = completedTasksPerTeam[teamName] || [];

        container.style.display = 'block';
        taskList.innerHTML = '';

        // Render 10 tasks in strict sequential order
        for (let i = 1; i <= 10; i++) {
            let taskId = `Task ${i}`;
            let isDone = teamCompleted.includes(taskId);
            
            // Check if previous task is completed
            let isPreviousDone = (i === 1) || teamCompleted.includes(`Task ${i - 1}`);

            let div = document.createElement('div');
            
            let badgeOrButton = '';
            if (isDone) {
                div.className = 'task-item completed';
                badgeOrButton = `<span>✅ Done</span>`;
            } else if (isPreviousDone) {
                // This is the next unlocked task available to complete
                div.className = 'task-item active';
                badgeOrButton = `<button onclick="submitTask('${teamName}', '${taskId}', this)">Complete ${taskId}</button>`;
            } else {
                // Locked until previous task is done
                div.className = 'task-item locked';
                badgeOrButton = `<span class="locked-badge">🔒 Locked (Complete Task ${i - 1} first)</span>`;
            }

            div.innerHTML = `
                <span><strong>${taskId}</strong></span>
                ${badgeOrButton}
            `;
            taskList.appendChild(div);
        }
    }

    async function submitTask(teamName, taskId, btnElement) {
        // Enforce sequential check in submission logic
        const match = taskId.match(/Task\s*(\d+)/i);
        const taskNum = match ? parseInt(match[1]) : 1;
        const teamCompleted = completedTasksPerTeam[teamName] || [];

        if (teamCompleted.includes(taskId)) {
            alert(`⚠️ ${taskId} has already been recorded!`);
            return;
        }

        if (taskNum > 1 && !teamCompleted.includes(`Task ${taskNum - 1}`)) {
            alert(`⛔ Task ${taskNum - 1} must be completed before submitting ${taskId}!`);
            return;
        }

        if (!confirm(`Are you sure you want to submit ${taskId} for ${teamName}? This will record the exact timestamp!`)) return;

        // Disable button immediately to prevent double clicking
        if (btnElement) {
            btnElement.disabled = true;
            btnElement.innerText = "Submitting...";
        }

        try {
            // Build the form data for Google Forms
            const formData = new URLSearchParams();
            formData.append(TEAM_ENTRY_ID, teamName);
            formData.append(TASK_ENTRY_ID, taskId);

            // Use 'no-cors' mode so Google accepts the AJAX submission from any domain
            await fetch(GOOGLE_FORM_ACTION_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: formData
            });

            showMessage(`✅ ${taskId} submitted successfully!`);
            
            // Optimistically update the UI so they don't double click
            if (!completedTasksPerTeam[teamName]) {
                completedTasksPerTeam[teamName] = [];
            }
            completedTasksPerTeam[teamName].push(taskId);
            loadTeamData();

            // Refetch true state quickly to sync
            setTimeout(fetchState, 1500);

        } catch (err) {
            showMessage("Failed to submit. Check internet connection.", true);
            if (btnElement) {
                btnElement.disabled = false;
                btnElement.innerText = `Complete ${taskId}`;
            }
        }
    }

    function showMessage(msg, isError = false) {
        const el = document.getElementById('status-msg');
        el.textContent = msg;
        el.className = isError ? 'error' : '';
        setTimeout(() => { el.textContent = ''; }, 3000);
    }

    // Load data on start
    fetchState();
    // Poll every 3 seconds for instant real-time sync
    setInterval(fetchState, 3000);
</script>

</body>
</html>
